<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Board 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header>
    <div>
      <div class="logo-mark">LIFT BOARD 2026</div>
      <div class="logo-sub">Top 5 per weight class</div>
    </div>
    <div class="hdiv"></div>
    <div class="gender-pill men" id="gender-indicator">MEN'S DIVISION</div>
    <div class="status-group">
      <div class="dot" id="dot"></div>
      <span id="status-txt">Loadingâ€¦</span>
    </div>
    <div class="header-spacer"></div>
  </header>
  <div class="boards">
    <section class="panel active" id="panel-men">
      <div class="gender-stripe men-stripe"></div>
      <div class="tbl-wrap" id="board-men"></div>
    </section>
    <section class="panel" id="panel-women">
      <div class="gender-stripe women-stripe"></div>
      <div class="tbl-wrap" id="board-women"></div>
    </section>
  </div>
  <div class="toast" id="toast">Board updated</div>
</div>
<script src="script.js"></script>
</body>
</html>
